# <pip-site-package-pyright-end>

[tool.ruff]
# Enable the flake8-bugbear (B) rules.
line-length = 120
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
# Enable Pyflakes (F), Mccabe (C90), isort (I), and Pycodestyle (E, W) by default.
select = ["E", "F", "W", "I", "B", "C90", "UP", "N"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# setup.py contains multi-platform provisioning logic and requires higher complexity tolerance.
"setup.py" = ["C901"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
