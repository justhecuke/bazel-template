repos:
  - repo: https://github.com/google/keep-sorted
    rev: v0.8.0
    hooks:
      - id: keep-sorted
  - repo: local
    hooks:
      - id: update-requirements
        name: update-requirements
        entry: python ./bin/update_requirements.py
        language: system
        files: ^requirements\.in$
        pass_filenames: false
      - id: update-ide-paths
        name: update-ide-paths
        entry: python ./bin/update_ide_paths.py
        language: system
        files: ^requirements\.txt$
        pass_filenames: false
      - id: buildifier
        name: buildifier
        entry: python ./bin/buildifier.py -lint fix -mode fix --
        language: system
        files: (^|/)(BUILD\.bazel|MODULE\.bazel|.*\.bzl)$
      - id: ruff-check
        name: ruff-check
        entry: python ./bin/ruff.py check --fix --force-exclude --
        language: system
        types: [python]
      - id: ruff-format
        name: ruff-format
        entry: python ./bin/ruff.py format --force-exclude --
        language: system
        types: [python]
      - id: pyrefly
        name: pyrefly
        entry: python ./bin/pyrefly.py check --
        language: system
        types: [python]
      - id: goimports
        name: goimports
        entry: python ./bin/goimports.py
        language: system
        files: \.go$
      - id: staticcheck
        name: staticcheck
        entry: python ./bin/staticcheck.py
        language: system
        files: \.go$
        pass_filenames: false
